<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Corazón</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050000;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: #050000;
        }

    </style>

</head>


<body>

    <canvas id="canvas"></canvas>


    <script>

        const WIDTH = 600;
        const HEIGHT = 700;
        const SCALE = 150;

        const canvas = document.getElementById("canvas");

        const ctx = canvas.getContext("2d");

        function resizeCanvas() {

            const ratio = Math.min(
                window.innerWidth / WIDTH,
                window.innerHeight / HEIGHT
            );

            canvas.width = WIDTH;
            canvas.height = HEIGHT;

            canvas.style.width =
                (WIDTH * ratio) + "px";

            canvas.style.height =
                (HEIGHT * ratio) + "px";
        }

        resizeCanvas();

        window.addEventListener(
            "resize",
            resizeCanvas
        );

        function heart(u) {

            const x =
                1.6 * Math.pow(Math.sin(u), 3);

            const y =
                1.3 * Math.cos(u)
                - 0.5 * Math.cos(2 * u)
                - 0.2 * Math.cos(3 * u)
                - 0.1 * Math.cos(4 * u);

            return [x, y];
        }

        const N = 1000;

        const pts = [];

        for (let i = 0; i < N; i++) {

            const u =
                Math.random() *
                Math.PI * 2;

            const [hx, hy] =
                heart(u);

            const rad =
                Math.sqrt(Math.random());

            const x =
                hx * rad;

            const y =
                hy * rad;

            const z =
                Math.random() * 2 - 1;

            const size =
                1 + Math.random() * 1.2;

            pts.push({
                x: x,
                y: y,
                z: z,
                size: size
            });
        }

        const rays = [];

        for (let i = 0; i < 100; i++) {

            const u =
                (2 * Math.PI / 80) * i;

            const [hx, hy] =
                heart(u);

            rays.push({
                x: hx * SCALE,
                y: hy * SCALE
            });
        }

        let step = 0;

        let t_val = 0;

        let phase = "grow";

        function loop() {

            ctx.fillStyle = "#050000";

            ctx.fillRect(
                0,
                0,
                WIDTH,
                HEIGHT
            );

            if (phase === "grow") {

                t_val += 0.055;

                if (t_val >= 1) {

                    t_val = 1;

                    phase = "pulse";
                }
            }

            let scale;

            if (phase === "pulse") {

                scale =
                    1 +
                    0.07 *
                    Math.sin(step * 0.12);

            } else {

                scale = t_val;
            }

            if (phase === "grow") {

                const head = t_val;

                const tail =
                    Math.max(
                        0,
                        t_val - 0.25
                    );


                ctx.strokeStyle =
                    "#8a0018";

                ctx.lineWidth = 1;


                for (const ray of rays) {

                    const x1 =
                        WIDTH / 2 +
                        ray.x * tail;

                    const y1 =
                        HEIGHT / 2 -
                        ray.y * tail;

                    const x2 =
                        WIDTH / 2 +
                        ray.x * head;

                    const y2 =
                        HEIGHT / 2 -
                        ray.y * head;


                    ctx.beginPath();

                    ctx.moveTo(
                        x1,
                        y1
                    );

                    ctx.lineTo(
                        x2,
                        y2
                    );

                    ctx.stroke();
                }
            }


            for (const point of pts) {

                const wave =
                    Math.sin(
                        step * 0.05 +
                        point.z * 6
                    ) * 0.6;


                const px =
                    WIDTH / 2 +
                    point.x *
                    SCALE *
                    scale +
                    wave;


                const py =
                    HEIGHT / 2 -
                    point.y *
                    SCALE *
                    scale +
                    wave;

                const brightness =
                    0.55 +
                    0.45 *
                    ((point.z + 1) / 2);


                const red =
                    Math.floor(
                        150 +
                        105 * brightness
                    );


                const green =
                    Math.floor(
                        5 +
                        20 * brightness
                    );


                const blue =
                    Math.floor(
                        10 +
                        35 * brightness
                    );

                ctx.fillStyle =
                    `rgb(${red}, ${green}, ${blue})`;


                ctx.beginPath();

                ctx.arc(
                    px,
                    py,
                    point.size,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }

            if (phase === "pulse") {

                const glow =
                    1 +
                    0.2 *
                    Math.sin(step * 0.12);


                ctx.fillStyle =
                    "#ff3150";


                for (
                    let i = 0;
                    i < pts.length;
                    i += 12
                ) {

                    const point =
                        pts[i];


                    const px =
                        WIDTH / 2 +
                        point.x *
                        SCALE *
                        scale;


                    const py =
                        HEIGHT / 2 -
                        point.y *
                        SCALE *
                        scale;


                    ctx.beginPath();

                    ctx.arc(
                        px,
                        py,
                        1.5 * glow,
                        0,
                        Math.PI * 2
                    );

                    ctx.fill();
                }
            }

            step++;

            requestAnimationFrame(loop);
        }

        loop();

    </script>

</body>

</html>
